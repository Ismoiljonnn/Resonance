<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance — Set up your profile</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231a1a2e' stroke='%238ab4f8' stroke-width='4'/><ellipse cx='50' cy='50' rx='20' ry='44' fill='none' stroke='%238ab4f8' stroke-width='2.5' opacity='.6'/><ellipse cx='50' cy='50' rx='44' ry='20' fill='none' stroke='%238ab4f8' stroke-width='2.5' opacity='.6'/><circle cx='50' cy='50' r='45' fill='none' stroke='%238ab4f8' stroke-width='4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:auto !important;overflow:auto !important;background:#0e0f11;font-family:'Roboto',-apple-system,BlinkMacSystemFont,sans-serif;color:#e8eaed;}
body{display:flex;justify-content:center;align-items:flex-start;min-height:100vh;min-height:100dvh;padding:40px 16px;}

.register-wrap{width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;}

h1{font-size:20px;font-weight:500;text-align:center;margin-bottom:4px;color:#e8eaed;}
.subtitle{font-size:14px;color:#9aa0a6;text-align:center;margin-bottom:28px;line-height:1.4;}

.form-group{width:100%;margin-bottom:16px;}
.form-group label{display:block;font-size:13px;font-weight:500;color:#e8eaed;margin-bottom:6px;}
.form-group input,.form-group select{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,0.10);border-radius:8px;background:#242528;color:#e8eaed;font-size:14px;font-family:inherit;transition:border-color .15s,box-shadow .15s;appearance:auto;}
.form-group input:focus,.form-group select:focus{outline:none;border-color:#8ab4f8;box-shadow:0 0 0 1px #8ab4f8;}
.form-group input::placeholder{color:#9aa0a6;}
.form-group .optional-tag{color:#9aa0a6;font-weight:400;font-size:12px;margin-left:4px;}

.section-label{width:100%;font-size:13px;font-weight:500;color:#9aa0a6;margin:24px 0 12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.10);}

.btn-submit{width:100%;padding:11px 16px;margin-top:8px;font-size:14px;font-weight:500;border:none;border-radius:8px;background:#8ab4f8;color:#0e0f11;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.btn-submit:hover{opacity:.88;}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#242528;color:#e8eaed;padding:10px 20px;border-radius:8px;font-size:13px;z-index:9999;transition:opacity .2s;pointer-events:none;border:1px solid rgba(255,255,255,0.10);}
#toast.hidden{opacity:0;}

@media(max-width:440px){
  body{padding:24px 16px;}
  h1{font-size:18px;}
}
</style>
</head>
<body>

<div class="register-wrap">
  <h1>Set up your profile</h1>
  <p class="subtitle">Choose how others see you on the map.</p>

  <div class="form-group">
    <label>Username</label>
    <input id="in-username" placeholder="e.g. alex" maxlength="80" autocomplete="new-password">
  </div>

  <div class="form-group">
    <label>Bio</label>
    <input id="in-bio" placeholder="A short description about you" maxlength="200" autocomplete="new-password">
  </div>

  <div class="form-group">
    <label>Country</label>
    <select id="in-country"></select>
  </div>

  <div class="form-group">
    <label>City <span class="optional-tag">optional</span></label>
    <input id="in-city" placeholder="e.g. Tashkent" autocomplete="new-password">
  </div>

  <div class="section-label">Social links <span class="optional-tag">optional</span></div>

  <div class="form-group">
    <label>Telegram</label>
    <input id="in-telegram" placeholder="username" autocomplete="new-password">
  </div>

  <div class="form-group">
    <label>GitHub</label>
    <input id="in-github" placeholder="username" autocomplete="new-password">
  </div>

  <div class="form-group">
    <label>Instagram</label>
    <input id="in-instagram" placeholder="username" autocomplete="new-password">
  </div>

  <div class="form-group">
    <label>Website <span class="optional-tag">optional</span></label>
    <input id="in-website" placeholder="yoursite.com" autocomplete="new-password">
  </div>

  <button id="saveProfileBtn" class="btn-submit">Continue</button>
</div>

<div id="toast" class="hidden"></div>

<script src="{{ url_for('static', filename='js/countries.js') }}"></script>
<script>
function buildUrl(v,prefix){v=(v||'').trim();if(!v)return'';return v.startsWith('http')?v:prefix+v;}
function jitterCoords(bLat,bLng){const s=2.5;return{lat:bLat+(Math.random()-.5)*s,lng:bLng+(Math.random()-.5)*s};}

function populateCountrySelect(sel){
  const sorted=[...COUNTRIES].sort((a,b)=>a[0].localeCompare(b[0]));
  sel.innerHTML=sorted.map(([n])=>`<option value="${n}">${n}</option>`).join('');
}

let toastTimeout;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.add('hidden'),2500);}

window.addEventListener('DOMContentLoaded',async()=>{
  populateCountrySelect(document.getElementById('in-country'));

  const meRes=await fetch('/auth/me');
  const meData=await meRes.json();
  if(!meData.authenticated){window.location.href='/';return;}
  if(meData.profile_complete){window.location.href='/';return;}

  const u=meData.user;
  document.getElementById('in-username').value=u.username||'';
  document.getElementById('in-bio').value=u.bio||'';
  document.getElementById('in-telegram').value=u.social_links&&u.social_links.telegram?u.social_links.telegram.replace('t.me/',''):'';
  document.getElementById('in-github').value=u.social_links&&u.social_links.github?u.social_links.github.replace('github.com/',''):'';
  document.getElementById('in-instagram').value=u.social_links&&u.social_links.instagram?u.social_links.instagram.replace('instagram.com/',''):'';
  document.getElementById('in-website').value=u.social_links&&u.social_links.website?u.social_links.website:'';
});

document.getElementById('saveProfileBtn').addEventListener('click',async()=>{
  const btn=document.getElementById('saveProfileBtn');
  const country=document.getElementById('in-country').value;
  if(!country){showToast('Please choose your country');return;}
  const base=COUNTRY_COORDS[country];
  const home=jitterCoords(base.lat,base.lng);

  btn.disabled=true;btn.textContent='Saving...';

  const payload={
    username:document.getElementById('in-username').value.trim(),
    bio:document.getElementById('in-bio').value.trim(),
    location_country:country,
    location_city:document.getElementById('in-city').value.trim()||null,
    home_lat:home.lat,
    home_lng:home.lng,
    social_links:{
      telegram:buildUrl(document.getElementById('in-telegram').value,'t.me/'),
      github:buildUrl(document.getElementById('in-github').value,'github.com/'),
      instagram:buildUrl(document.getElementById('in-instagram').value,'instagram.com/'),
      website:document.getElementById('in-website').value.trim(),
    },
  };
  const res=await fetch('/api/profile',{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify(payload),
  });
  if(!res.ok){const err=await res.json();showToast(err.error||'Something went wrong');btn.disabled=false;btn.textContent='Continue';return;}
  window.location.href='/';
});
</script>
</body>
</html>
