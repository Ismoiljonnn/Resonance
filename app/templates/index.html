<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resonance — Echoes of the Earth</title>
<meta name="description" content="Share your thoughts and see what others are thinking around the world on the map.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231a1a2e' stroke='%238ab4f8' stroke-width='4'/><ellipse cx='50' cy='50' rx='20' ry='44' fill='none' stroke='%238ab4f8' stroke-width='2.5' opacity='.6'/><ellipse cx='50' cy='50' rx='44' ry='20' fill='none' stroke='%238ab4f8' stroke-width='2.5' opacity='.6'/><circle cx='50' cy='50' r='45' fill='none' stroke='%238ab4f8' stroke-width='4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">
<script src="https://unpkg.com/globe.gl"></script>
</head>
<body>

<div id="globeViz"></div>
<div id="globeGradient"></div>

<!-- Top app bar -->
<header id="topbar">
  <div id="brand">
    <svg class="brand-icon" width="28" height="28" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#1a1a2e" stroke="#8ab4f8" stroke-width="4"/><ellipse cx="50" cy="50" rx="20" ry="44" fill="none" stroke="#8ab4f8" stroke-width="2.5" opacity=".6"/><ellipse cx="50" cy="50" rx="44" ry="20" fill="none" stroke="#8ab4f8" stroke-width="2.5" opacity=".6"/></svg>
    <span class="brand-name">Resonance</span>
  </div>

  <div id="topbar-actions">
    <button id="recordTrigger" class="btn-primary">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M11 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Share a thought
    </button>

    <button id="searchTrigger" class="btn-round" title="Search users">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <button id="loginBtn" class="btn-outline" onclick="window.location.href='/auth/google/login'">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Login
    </button>

    <div id="userChip" class="hidden">
      <button id="userChipBtn" class="user-chip-btn">
        <img id="userAvatar" src="" alt="">
        <span id="userName"></span>
      </button>
      <div id="userMenu" class="user-menu hidden">
        <button id="myProfileBtn" class="user-menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/></svg>
          My profile
        </button>
        <button id="adminBtn" class="user-menu-item hidden" onclick="location.href='/admin'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V6a2 2 0 00-2-2H6a2 2 0 00-2 2v2h16z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Admin
        </button>
        <button id="logoutBtn" class="user-menu-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Sign out
        </button>
      </div>
    </div>
  </div>
</header>

<!-- Bottom bar (mobile only) -->
<nav id="bottomBar" class="bottom-bar">
  <button id="bbSearch" class="bb-btn" title="Search">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <button id="bbRecord" class="bb-btn bb-primary" title="Share a thought">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M11 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2v-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 2.5a2.12 2.12 0 013 3L12 15l-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="bbUser" class="bb-user-wrap">
    <button id="bbLogin" class="bb-btn" title="Login">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="bbProfile" class="bb-btn hidden" title="Profile">
      <img id="bbAvatar" src="" alt="" class="bb-avatar">
    </button>
    <div id="bbMenu" class="bb-menu hidden">
      <button id="bbMyProfile" class="user-menu-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/></svg>
        My profile
      </button>
      <button id="bbLogout" class="user-menu-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Sign out
      </button>
    </div>
  </div>
</nav>

<!-- Hover preview: avatar on the left, note preview on the right -->
<div id="hoverCard" class="hover-card hidden">
  <img id="hover-avatar" class="hover-avatar" src="" alt="">
  <div class="hover-card-inner">
    <div id="hover-name" class="hover-name"></div>
    <div id="hover-city" class="hover-city"></div>
    <div id="hover-text" class="hover-text"></div>
    <div id="hover-date" class="hover-date"></div>
  </div>

</div>

<!-- Profile page: same modal renders both "my profile" (editable) and a stranger's profile (read-only) -->
<div id="profileModal" class="modal hidden">
  <div class="modal-content profile-card">

    <div class="profile-header">
      <img id="pf-avatar" class="avatar-lg" src="" alt="">
      <div class="profile-header-info">
        <h2 id="pf-name"></h2>
        <p id="pf-username" class="muted"></p>
        <p id="pf-location" class="muted location-row">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7-6.1-7-11a7 7 0 0114 0c0 4.9-7 11-7 11z" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="10" r="2.5" stroke="currentColor" stroke-width="2"/></svg>
          <span id="pf-location-text"></span>
        </p>
      </div>
      <div class="profile-header-actions">
        <button id="editProfileBtn" class="btn-outline hidden">Edit profile</button>
        <button class="close-btn" data-close="profileModal">&times;</button>
      </div>
    </div>

    <!-- Read view -->
    <div id="pf-view">
      <p id="pf-bio" class="pf-bio"></p>
      <div id="pf-links" class="links-row"></div>
      <div id="pf-joined" class="muted joined-row">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 2v4M8 2v4M3 10h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="pf-joined-text"></span>
      </div>
      <div class="stats-row">
        <button class="stats-tab active" data-tab="active"><strong id="pf-active-count">0</strong> <span>Active posts</span></button>
        <button class="stats-tab" data-tab="total"><strong id="pf-total-count">0</strong> <span>Total posts</span></button>
      </div>
      <div id="pf-posts-list" class="posts-list"></div>
    </div>

    <!-- Edit view (my profile only) -->
    <div id="pf-edit" class="hidden">
      <label class="field-label">Username</label>
      <input id="edit-username" maxlength="80" placeholder="username" autocomplete="new-password">
      <label class="field-label">Bio</label>
      <input id="edit-bio" maxlength="200" placeholder="bio" autocomplete="new-password">
      <label class="field-label">Country</label>
      <select id="edit-country"></select>
      <label class="field-label">City <span class="optional">(optional)</span></label>
      <input id="edit-city" maxlength="120" placeholder="city" autocomplete="new-password">
      <label class="field-label">Telegram</label>
      <input id="edit-telegram" placeholder="username" autocomplete="new-password">
      <label class="field-label">GitHub</label>
      <input id="edit-github" placeholder="username" autocomplete="new-password">
      <label class="field-label">Instagram</label>
      <input id="edit-instagram" placeholder="username" autocomplete="new-password">
      <label class="field-label">Website <span class="optional">(optional)</span></label>
      <input id="edit-website" placeholder="yoursite.com" autocomplete="new-password">
      <div class="edit-actions">
        <button id="cancelEditBtn" class="btn-text">Cancel</button>
        <button id="saveEditBtn" class="btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>

<!-- Onboarding (region + profile) then post composer -->
<div id="recorderModal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-top-row">
      <h3 id="recorder-title">Share your thought</h3>
      <button class="close-btn" data-close="recorderModal">&times;</button>
    </div>

    <div id="textStep">
      <textarea id="in-text-post" placeholder="Write what's on your mind..." maxlength="500" rows="5"></textarea>
      <div class="char-counter"><span id="charCount">0</span>/500</div>
      <button id="publishTextBtn" class="btn-primary full-width">Post to the map</button>
    </div>
  </div>
</div>

<!-- Single post view (opened via share link) -->
<div id="postModal" class="modal hidden">
  <div class="modal-content post-card">
    <div class="modal-top-row">
      <div id="post-author-row" class="profile-header small"></div>
      <button class="close-btn" data-close="postModal">&times;</button>
    </div>
    <div id="post-body"></div>
    <div class="post-actions">
      <button id="shareBtn" class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 12v7a2 2 0 002 2h12a2 2 0 002-2v-7M16 6l-4-4-4 4M12 2v14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Share
      </button>
    </div>
  </div>
</div>

<!-- Search modal -->
<div id="searchModal" class="modal hidden">
  <div class="modal-content search-card">
    <div class="modal-top-row">
      <h3>Search users</h3>
      <button class="close-btn" data-close="searchModal">&times;</button>
    </div>
    <div class="search-input-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="searchInput" type="text" placeholder="Search by name or username..." maxlength="80" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false">
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<div id="confirmModal" class="modal hidden">
  <div class="modal-content" style="width:360px;text-align:center;padding:28px">
    <p id="confirmMsg" style="margin:0 0 20px;font-size:14px;color:var(--text)"></p>
    <div style="display:flex;gap:8px;justify-content:center">
      <button id="confirmCancel" class="btn-outline" style="padding:8px 20px">Cancel</button>
      <button id="confirmOk" class="btn-primary" style="padding:8px 20px;background:var(--danger)">Delete</button>
    </div>
  </div>
</div>

<script src="{{ url_for('static', filename='js/countries.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
